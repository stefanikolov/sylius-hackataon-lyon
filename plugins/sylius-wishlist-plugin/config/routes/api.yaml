# JSON API for wishlists. The host imports this file under the Sylius shop API prefix (/api/v2/shop), so customers use
# the same JWT as for the rest of the shop API. The route default marks the request as an API request.
mark_app_wishlist_api_list:
    path: /wishlists
    methods: [GET]
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::list', _mark_app_wishlist_api: true }

mark_app_wishlist_api_create:
    path: /wishlists
    methods: [POST]
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::create', _mark_app_wishlist_api: true }

mark_app_wishlist_api_show:
    path: /wishlists/{id}
    methods: [GET]
    requirements: { id: '\d+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::show', _mark_app_wishlist_api: true }

mark_app_wishlist_api_update:
    path: /wishlists/{id}
    methods: [PATCH]
    requirements: { id: '\d+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::update', _mark_app_wishlist_api: true }

mark_app_wishlist_api_delete:
    path: /wishlists/{id}
    methods: [DELETE]
    requirements: { id: '\d+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::delete', _mark_app_wishlist_api: true }

mark_app_wishlist_api_add_item:
    path: /wishlists/{id}/items
    methods: [POST]
    requirements: { id: '\d+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::addItem', _mark_app_wishlist_api: true }

mark_app_wishlist_api_remove_item:
    path: /wishlists/{id}/items/{productCode}
    methods: [DELETE]
    requirements: { id: '\d+', productCode: '[^/]+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::removeItem', _mark_app_wishlist_api: true }

mark_app_wishlist_api_move_item:
    path: /wishlists/{id}/items/{productCode}/move
    methods: [POST]
    requirements: { id: '\d+', productCode: '[^/]+' }
    defaults: { _controller: 'MarkApp\SyliusWishlistPlugin\Controller\Api\WishlistsController::moveItem', _mark_app_wishlist_api: true }
